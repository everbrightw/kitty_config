# Kitty configuration for the AstroNvim + Obsidian workflow

# Typography: match the existing iTerm2 profile.
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# A slightly airy editor window with restrained translucency.
background_opacity 0.90
dynamic_background_opacity yes
background_blur 20
window_padding_width 8
confirm_os_window_close 0
macos_titlebar_color background
macos_option_as_alt left

# A short Eldritch-green trail makes large Neovim cursor jumps easier to track.
cursor_trail 100
cursor_trail_decay 0.08 0.22
cursor_trail_start_threshold 2
cursor_trail_color #37f499

# Keep scrollback invisible until it is actually being browsed.
scrollbar scrolled
scrollbar_width 0.35
scrollbar_handle_opacity 0.35
scrollbar_handle_color #37f499
scrollbar_track_opacity 0

# Keep shell navigation and command-output features available.
shell_integration enabled
startup_session startup.conf

# Top tab bar, themed to match Eldritch and optimized for keyboard navigation.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 1
tab_title_max_length 28
tab_title_template " {index}: {title} · {layout_name} · {num_windows} "
tab_activity_symbol " ●"
tab_bar_background #0a0a0a
active_tab_foreground #0a0a0a
active_tab_background #37f499
active_tab_font_style bold
inactive_tab_foreground #b7bfce
inactive_tab_background #141414
inactive_tab_font_style normal

# Eldritch palette used by Neovim.
foreground            #ffffff
background            #0a0a0a
selection_foreground  #ffffff
selection_background  #3d3d3d
cursor                 #37f499
cursor_text_color      #0a0a0a
url_color              #04d1f9
active_border_color    #37f499
inactive_border_color  #3d3d3d
bell_border_color      #f1fc79
color0  #0a0a0a
color1  #f16c75
color2  #37f499
color3  #f1fc79
color4  #987afb
color5  #fca6ff
color6  #04d1f9
# ANSI "white" should be genuinely bright for welcome-screen readability.
color7  #ffffff
color8  #3d3d3d
color9  #f16c75
color10 #37f499
color11 #f1fc79
color12 #987afb
color13 #fca6ff
color14 #04d1f9
color15 #ffffff

# Familiar macOS shortcuts; Kitty's standard tab shortcuts remain available.
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n launch --type=os-window --cwd=current --env KITTY_POKEMON_WELCOME=1
map cmd+t launch --type=tab --cwd=current --env KITTY_POKEMON_WELCOME=1

# Iris-friendly tab navigation: left thumb Command + right home-row H/L.
map cmd+h previous_tab
map cmd+l next_tab
map cmd+shift+h move_tab_backward
map cmd+shift+l move_tab_forward

# Quick opacity adjustments while evaluating the setup.
map ctrl+shift+] set_background_opacity +0.05
map ctrl+shift+[ set_background_opacity -0.05
map ctrl+shift+\\ set_background_opacity default
